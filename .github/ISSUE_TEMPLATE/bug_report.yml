name: Bug report
description: Something in openswap isn't working right
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you see, and what did you expect instead?
      placeholder: Ran `openswap switch 2`, got ... — expected ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: openswap version and install method
      description: Output of `openswap --version`, and whether you installed with uv, pipx, or from source.
      placeholder: openswap 0.20.0, installed with uv
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      description: OpenSwap ships for macOS. Other OS values are CLI-only / test-farm reports.
      options:
        - macOS
        - Linux (CLI only, unsupported)
        - Windows (CLI only, unsupported)
        - WSL (CLI only, unsupported)
    validations:
      required: true
  - type: dropdown
    id: claude-code
    attributes:
      label: How do you run Claude Code?
      multiple: true
      options:
        - CLI (terminal)
        - VS Code extension
        - Desktop app
  - type: textarea
    id: logs
    attributes:
      label: Command output or logs
      description: Paste the failing command's output — `openswap list` for account-state issues, `openswap auto` log lines for auto-switch issues. Formatted automatically, no backticks needed. Please redact emails/account identifiers, and never paste access/refresh tokens, API keys, setup tokens, or credential-file/Keychain contents.
      render: shell
