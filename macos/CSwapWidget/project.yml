name: CSwapWidget
options:
  bundleIdPrefix: com.cswap
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  defaultConfig: Release
settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: NO
    COMBINE_HIDPI_IMAGES: YES
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: "0.27.0"
    GENERATE_INFOPLIST_FILE: YES
    SWIFT_STRICT_CONCURRENCY: minimal
targets:
  CSwapWidget:
    type: application
    platform: macOS
    sources:
      - path: Host
        excludes:
          - Info.plist
          - "*.entitlements"
    settings:
      base:
        PRODUCT_NAME: cswap Widget
        PRODUCT_BUNDLE_IDENTIFIER: com.cswap.widget
        INFOPLIST_FILE: Host/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: cswap
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Host/Host.entitlements
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
    dependencies:
      - sdk: WidgetKit.framework
      - target: CSwapWidgetExtension
        embed: true
        codeSign: true
    scheme:
      testTargets: []
  CSwapWidgetExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: Widget
        excludes:
          - Info.plist
          - "*.entitlements"
    settings:
      base:
        PRODUCT_NAME: CSwapWidgetExtension
        PRODUCT_BUNDLE_IDENTIFIER: com.cswap.widget.extension
        INFOPLIST_FILE: Widget/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: cswap
        APPLICATION_EXTENSION_API_ONLY: YES
        CODE_SIGN_ENTITLEMENTS: Widget/Widget.entitlements
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks @executable_path/../../../../Frameworks"
        SKIP_INSTALL: YES
        MACOSX_DEPLOYMENT_TARGET: "14.0"
schemes:
  CSwapWidget:
    build:
      targets:
        CSwapWidget: all
        CSwapWidgetExtension: all
    run:
      config: Release
